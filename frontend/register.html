<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Lost and Found</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <div class="brand-wrapper">
                <div class="brand-icon">L&amp;F</div>
                <h1><a href="index.html">Campus Lost &amp; Found</a></h1>
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="active">Register</a>
            </nav>
        </div>
    </header>

    <main class="container auth-container">

        <div class="form-card">
            <div class="auth-header">
                <h1>Student Portal</h1>
                <h2>Create Account</h2>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="e.g. John Doe" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">College Email Address</label>
                    <input type="email" id="email" placeholder="student@college.edu" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password">
                </div>

                <button type="submit">Register</button>
            </form>

            <p id="registerMessage"></p>

            <p>
                Already have an account? <a href="login.html">Login here</a>
            </p>
            <p>
                <a href="index.html">&larr; Back to Home</a>
            </p>
        </div>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Campus Lost and Found &bull; College Student Project</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
