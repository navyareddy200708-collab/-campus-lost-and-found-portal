<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item - Campus Lost and Found</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <div class="brand-wrapper">
                <div class="brand-icon">L&amp;F</div>
                <h1><a href="index.html">Campus Lost &amp; Found</a></h1>
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="report.html" class="active">Report Item</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <div class="form-card">
            <h2>Report Lost or Found Item</h2>
            <p>Please provide descriptive and accurate details to help locate or identify the item.</p>

            <form id="reportForm">
                <div class="form-group">
                    <label for="itemName">Item Name *</label>
                    <input type="text" id="itemName" placeholder="e.g. Blue Dell Laptop Charger, Black Wallet" required>
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Books">Books</option>
                        <option value="Documents">Documents</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="type">Listing Type *</label>
                    <select id="type" required>
                        <option value="">Select Type</option>
                        <option value="lost">Lost (I lost this item)</option>
                        <option value="found">Found (I found this item)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Detailed Description *</label>
                    <textarea id="description" placeholder="Mention brand, color, distinguishing marks, or condition" required></textarea>
                </div>

                <div class="form-group">
                    <label for="location">Campus Location *</label>
                    <input type="text" id="location" placeholder="e.g. Central Library 2nd Floor, Canteen, Block A Room 204" required>
                </div>

                <div class="form-group">
                    <label for="date">Date Lost / Found *</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label for="image">
                        Image URL
                        <span class="optional">(Optional - Direct image link if available)</span>
                    </label>
                    <input type="text" id="image" placeholder="https://example.com/photo.jpg">
                </div>

                <button type="submit">Submit Report</button>
            </form>

            <p id="reportMessage"></p>

            <p>
                <a href="dashboard.html">&larr; Back to Dashboard</a>
            </p>
        </div>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Campus Lost and Found &bull; College Student Project</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
