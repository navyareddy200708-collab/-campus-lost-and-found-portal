<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Lost and Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="header-content">

            <h1>Campus Lost and Found</h1>

            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
                <a href="report.html">Report Item</a>
                <a href="dashboard.html">Dashboard</a>
            </nav>

        </div>

    </header>


    <main class="container">

        <section class="hero">

            <h2>Find What You Lost</h2>

            <p>
                Report lost or found items and help reconnect students with their belongings.
            </p>

        </section>


        <section>

            <h2>Search Items</h2>

            <div class="search-box">

                <input type="text" id="searchInput" placeholder="Search by item name or description">

                <select id="categoryFilter">

                    <option value="">
                        All Categories
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Books">
                        Books
                    </option>

                    <option value="Documents">
                        Documents
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <input type="text" id="locationFilter" placeholder="Location">


                <select id="typeFilter">

                    <option value="">
                        All Types
                    </option>

                    <option value="lost">
                        Lost
                    </option>

                    <option value="found">
                        Found
                    </option>

                </select>


                <select id="dateSort">

                    <option value="">
                        Sort by Date
                    </option>

                    <option value="newest">
                        Newest First
                    </option>

                    <option value="oldest">
                        Oldest First
                    </option>

                </select>


                <button id="searchBtn">
                    Search
                </button>

            </div>

        </section>


        <section>

            <h2>Recent Items</h2>

            <div id="itemsList"></div>

        </section>


        <section id="claimSection" class="form-section" style="display: none;">

            <h2>Submit Claim</h2>

            <form id="claimForm">

                <input type="hidden" id="claimItemId">


                <label for="claimMessage">
                    Claim Message
                </label>

                <textarea id="claimMessage" placeholder="Explain why this item belongs to you" required></textarea>


                <button type="submit">
                    Submit Claim
                </button>

            </form>


            <p id="claimMessageResult"></p>

        </section>

    </main>


    <footer class="footer">

        <p>
            © 2026 Campus Lost and Found
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
